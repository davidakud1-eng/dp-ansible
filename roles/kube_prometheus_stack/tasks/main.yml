---
# ============================================================================
# DP kube-prometheus-stack
# Installs and manages the EKS monitoring platform using Helm
# ============================================================================

- name: Manage kube-prometheus-stack
  when: eks_runtime_enabled | bool
  block:

    # ==========================================================================
    # Prometheus Community Helm Repository
    #
    # Managed declaratively using kubernetes.core.helm_repository.
    # Ansible ensures the repository exists rather than executing
    # "helm repo add" on every pipeline run.
    # ==========================================================================

    - name: Ensure Prometheus Community Helm repository is configured
      become: false
      kubernetes.core.helm_repository:
        name: "{{ kps_helm_repo_name }}"
        repo_url: "{{ kps_helm_repo_url }}"
        state: present

    # ==========================================================================
    # kube-prometheus-stack Values
    #
    # Render the DP-specific Helm values used by the release.
    # The template module is idempotent and reports a change only
    # when the rendered file content changes.
    # ==========================================================================

    - name: Render kube-prometheus-stack values
      become: false
      ansible.builtin.template:
        src: values.yaml.j2
        dest: /tmp/dp-kube-prometheus-stack-values.yaml
        mode: "0600"

    # ==========================================================================
    # kube-prometheus-stack Helm Release
    #
    # Managed declaratively using kubernetes.core.helm.
    # Ansible ensures that the desired release exists with the
    # DP values rather than executing "helm upgrade --install"
    # unconditionally on every pipeline run.
    # ==========================================================================

    - name: Ensure kube-prometheus-stack is deployed
      become: false
      kubernetes.core.helm:
        name: "{{ kps_release_name }}"
        chart_ref: "{{ kps_chart_name }}"
        release_namespace: "{{ kps_namespace }}"
        create_namespace: true
        values_files:
          - /tmp/dp-kube-prometheus-stack-values.yaml
        reset_values: true
        wait: true
        timeout: 10m
        state: present