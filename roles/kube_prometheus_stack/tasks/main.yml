---
# ============================================================================
# DP kube-prometheus-stack
# Installs the EKS monitoring platform using Helm
# ============================================================================

- name: Manage kube-prometheus-stack
  when: eks_runtime_enabled | bool
  block:

    - name: Add Prometheus Community Helm repository
      become: false
      ansible.builtin.command:
        cmd: >
          helm repo add
          {{ kps_helm_repo_name }}
          {{ kps_helm_repo_url }}
          --force-update
      register: kps_helm_repo_add
      changed_when: >
        'has been added' in kps_helm_repo_add.stdout

    - name: Update Helm repository cache
      become: false
      ansible.builtin.command:
        cmd: helm repo update
      changed_when: false

    - name: Render kube-prometheus-stack values
      become: false
      ansible.builtin.template:
        src: values.yaml.j2
        dest: /tmp/dp-kube-prometheus-stack-values.yaml
        mode: "0600"

    - name: Install or upgrade kube-prometheus-stack
      become: false
      ansible.builtin.command:
        cmd: >
          helm upgrade --install
          {{ kps_release_name }}
          {{ kps_chart_name }}
          --namespace {{ kps_namespace }}
          --create-namespace
          --values /tmp/dp-kube-prometheus-stack-values.yaml
          --wait
          --timeout 10m
      register: kps_helm_install
      changed_when: >
        'STATUS: deployed' in kps_helm_install.stdout
