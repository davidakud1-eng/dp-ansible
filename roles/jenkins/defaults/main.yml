# ============================================================================
# Jenkins Service
# ============================================================================

jenkins_package_name: jenkins
jenkins_service_name: jenkins

jenkins_http_port: 8080
jenkins_home: /var/lib/jenkins

# ============================================================================
# Jenkins Administration
# ============================================================================

jenkins_admin_user: admin

# ============================================================================
# Jenkins Repository
# ============================================================================

jenkins_repository_name: jenkins
jenkins_repository_description: Jenkins Stable Repository
jenkins_repository_baseurl: https://pkg.jenkins.io/rpm-stable
jenkins_repository_gpg_key: https://pkg.jenkins.io/rpm-stable/jenkins.io-2026.key

# ============================================================================
# Jenkins Configuration as Code
# ============================================================================

jenkins_casc_directory: /var/lib/jenkins/casc_configs

jenkins_admin_username: kingdayve
jenkins_admin_full_name: David Aku

jenkins_admin_password: "{{ vault_jenkins_admin_password }}"

jenkins_url: "http://3.147.63.167:8080/"

jenkins_system_message: |
  ============================================================================
  DP DevSecOps Platform
  Managed by Jenkins Configuration as Code (JCasC)
  ============================================================================

# ============================================================================
# Jenkins Plugin Installation Manager
# ============================================================================

jenkins_plugin_manager_version: "2.15.0"
jenkins_plugin_manager_jar: /opt/jenkins-plugin-manager.jar

jenkins_war: /usr/share/java/jenkins.war

jenkins_plugins_file: /var/lib/jenkins/plugins.txt
jenkins_plugins_directory: /var/lib/jenkins/plugins
# ============================================================================
# Jenkins Pipeline Jobs
# ============================================================================

jenkins_pipeline_credentials_id: "github-token"
jenkins_pipeline_branch: "*/main"
jenkins_pipeline_script_path: "Jenkinsfile"

jenkins_pipeline_jobs:
  - name: "dp-mywebapp"
    repository_url: "https://github.com/davidakud1-eng/dp-mywebapp.git"

  - name: "dp-ansible"
    repository_url: "https://github.com/davidakud1-eng/dp-ansible.git"

  - name: "dp-platform-infra"
    repository_url: "https://github.com/davidakud1-eng/dp-platform-infra.git"
