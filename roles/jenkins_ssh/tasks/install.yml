---
# ============================================================================
# Jenkins SSH Key Management
# ============================================================================

- name: Create Jenkins SSH directory
  ansible.builtin.file:
    path: "{{ jenkins_ssh_dir }}"
    state: directory
    owner: "{{ jenkins_user }}"
    group: "{{ jenkins_user }}"
    mode: "0700"

- name: Check whether Jenkins SSH private key exists
  ansible.builtin.stat:
    path: "{{ jenkins_private_key }}"
  register: jenkins_ssh_key

- name: Generate Jenkins Ed25519 SSH key
  ansible.builtin.command:
    cmd: >-
      ssh-keygen
      -t ed25519
      -N ""
      -f {{ jenkins_private_key }}
  become_user: "{{ jenkins_user }}"
  when: not jenkins_ssh_key.stat.exists

# ============================================================================
# Read Jenkins SSH Private Key for JCasC
# ============================================================================

- name: Read Jenkins SSH private key
  ansible.builtin.slurp:
    src: "{{ jenkins_private_key }}"
  register: jenkins_private_key_raw
  no_log: true

- name: Decode Jenkins SSH private key
  ansible.builtin.set_fact:
    jenkins_agent_private_key_content: >-
      {{ jenkins_private_key_raw.content | b64decode }}
  no_log: true