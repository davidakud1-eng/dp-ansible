---
# ============================================================================
# DP Platform Operations Server
# ============================================================================

- name: Configure Platform Operations Server
  hosts: platform_ops
  remote_user: ec2-user

  become: true
  become_method: sudo
  become_flags: -n

  gather_facts: true

  roles:
    - common
    - git
    - java
    - jenkins_agent
    - ansible
    - terraform
    - kubectl
    - helm

    - role: node_exporter
      tags:
        - node_exporter

    - role: platform_ssh
      tags:
        - platform_ssh