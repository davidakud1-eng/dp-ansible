---
# ============================================================================
# DP Jenkins Permanent Build Agent
# ============================================================================

- name: Configure Build Agent
  hosts: build_agents
  remote_user: ec2-user

  become: true
  become_method: sudo
  become_flags: -n

  gather_facts: true

  roles:
    - common
    - git
    - java
    - maven
    - docker
    - jenkins_agent
    - trivy

    - role: node_exporter
      tags:
        - node_exporter